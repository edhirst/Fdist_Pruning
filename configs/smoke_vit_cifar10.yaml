# SMOKE test config (NOT a research run): 2-epoch SimpleViT on CIFAR-10 + a
# coarse pruning sweep, to confirm the cluster environment/GPU/pipeline end-to-end
# within the testegpu 30-min limit. Isolated outputs (models/smoke_*, results_smoke/).
# Run:  BASE_CONFIG=configs/smoke_vit_cifar10.yaml ./run_experiment.sh

paths:
  pretrained_model_path: models/smoke_SimpleViT_cifar10.pth
  dataset_path: data/
  model_save_path: models/
  log_path: logs/
  results_dir: results_smoke
dataset:
  name: cifar10
model:
  common:
    model_type: transformer
    num_classes: 10
  NN:
    hidden_size: 64
    hidden_layers: 2
  Transformer:
    embed_dim: 128
    depth: 4
    num_heads: 4
    mlp_ratio: 2.0
    patch_size: 4
    dropout: 0.0
training:
  batch_size: 128
  num_epochs: 5
  learning_rate: 0.001
  optimizer: adam
  num_workers: 4
  pin_memory: true
  nn:
    num_epochs: 50
  transformer:
    num_epochs: 2
    learning_rate: 0.0005
    optimizer: adamw
    weight_decay: 0.05
    warmup_epochs: 1
    label_smoothing: 0.1
    grad_clip: 1.0
pruning:
  enable_pruning: true
  pruning_scheme: magnitude
  fim_subset_size: 256
  fim_subset_seed: 42
  fim_subset_shuffle: true
  fim_calculate_method: backprop
  fim_device: auto
  prunable_exclude: null
  sweep:
    start: 0.0
    end: 1.0
    step: 0.5
  f_dist_avg_points: 3
  warm_start:
    enabled: false
    ratio: 0.8
evaluation:
  metrics:
  - accuracy
  - loss
  - precision
  - f1-score
  - mcc
  validation_split: 0.2
cross_validation:
  num_folds: 1
plots:
  save_plots: true
  plot_formats:
  - png
  dpi: null
