paths:
  dataset_path: "data/"
  model_save_path: "models/"
  log_path: "logs/"
  
dataset:
  name: "mnist"
  # Change to "fashion_mnist" to use Fashion-MNIST instead

model:
  num_classes: 10

training:
  batch_size: 64
  num_epochs: 2 #50
  learning_rate: 0.001
  optimizer: "adam"
  
pruning:
  enable_pruning: true
  pruning_scheme: "magnitude"  # Options: magnitude, fim, magnitude_fim_one_shot, magnitude_fim_iterative, sqrt_averaged_magnitude_fim
  pruning_threshold: 0.1
  # For magnitude pruning: prune weights with |w| < threshold
                           # Typical values: 0.001-0.01 (prunes small weights)
                           # Higher = more aggressive pruning
  fim_threshold: 0.1 # For FIM-based pruning methods
  iterative_pruning_steps: 5
  
evaluation:
  # Basic metrics
  metrics: 
    - accuracy
    - loss
    - mcc
    - precision
  validation_split: 0.2
  
  # Cross-validation settings
  cross_validation:
    num_folds: 5
    
  # Pruning sweep settings
  pruning_sweep:
    full_range:
      start: 0.0
      end: 1.0
      step: 0.05
    high_range:
      start: 0.80
      end: 1.0
      step: 0.02
  
  # Plotting settings
  plots:
    save_plots: true
    plot_formats: ["png", "pdf"]
    dpi: 300
# NOTES:
# - To use Fashion-MNIST: change dataset.name to "fashion_mnist"
# - To use MNIST: change dataset.name to "mnist"
# - Pruning threshold typically ranges from 0.001 to 0.1
#   - 0.001: very conservative (prunes very few weights)
#   - 0.01: moderate (good starting point)
#   - 0.1: aggressive (prunes many weights)