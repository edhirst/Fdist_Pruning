paths:
  pretrained_model_path: "models/SimpleNN_h2_n64.pth"
  dataset_path: "data/"
  model_save_path: "models/"
  log_path: "logs/"

dataset:
  # Options: "mnist", "fashion_mnist"
  name: "mnist"

# ---------------------- Configuration for training model ----------------------
model:
  common:
    # Options: "NN", "CNN"
    model_type: "NN"
    num_classes: 10

  # Only used when model_type == "NN"
  NN:
    hidden_size: 64
    hidden_layers: 2

training:
  batch_size: 128
  num_epochs: 5
  learning_rate: 0.001
  optimizer: "adam"
  num_workers: 4      # parallel DataLoader workers; set 0 on Windows or if using fork-unsafe libs
  pin_memory: true    # faster CPU→GPU transfers; set false if running on CPU-only


# ---------------------- Configuration for pruning model ----------------------
pruning:
  enable_pruning: true # Always True when running pruning.py
  pruning_scheme: "magnitude" # Options: magnitude, fim, f_dist_one_shot, f_dist_iterative, f_dist

  # FIM-related settings (only used by FIM-based schemes)
  fim_subset_size: 500
  fim_subset_seed: 42
  fim_subset_shuffle: true
  fim_calculate_method: "backprop" # Options: "nngeometry", "backprop"
  # Sweep settings (pruning.py uses this to generate pruning ratios)
  sweep:
    start: 0.8
    end: 1.0
    step: 0.02

  f_dist_avg_points: 2 # 

evaluation: 
  # Basic metrics 
  metrics: 
    - accuracy 
    - loss 
    - precision 
    - f1-score
    - mcc
  validation_split: 0.2 
  
# Cross-validation settings 
cross_validation: 
  num_folds: 1

# Plotting settings 
plots: 
  save_plots: true 
  plot_formats: ["png"] #...choose: ["png", "pdf"]
  dpi: null 

# NOTES: 
# - To use Fashion-MNIST: change dataset.name to "fashion_mnist" 
# - To use MNIST: change dataset.name to "mnist" 
# - Pruning threshold typically ranges from 0.001 to 0.1 
# - 0.001: very conservative (prunes very few weights) 
# - 0.01: moderate (good starting point) 
# - 0.1: aggressive (prunes many weights)

