paths:
  pretrained_model_path: "models/SimpleNN_h2_n32.pth"
  dataset_path: "data/"
  model_save_path: "models/"
  log_path: "logs/"

dataset:
  # Options: "mnist", "fashion_mnist"
  name: "mnist"

model:
  common:
    # Options: "NN", "CNN"
    model_type: "NN"
    num_classes: 10

  # Only used when model_type == "NN"
  NN:
    hidden_size: 32
    hidden_layers: 2

training:
  batch_size: 128
  num_epochs: 1
  learning_rate: 0.001
  optimizer: "adam"

pruning:
  enable_pruning: true # Always True when running pruning.py
  pruning_scheme: "f_dist_iterative" # Options: magnitude, fim, f_dist_one_shot, f_dist_iterative, sqrt_averaged_magnitude_fim
  # NOTE: pruning.py currently uses pruning.sweep for evaluation curves.
  # This field is kept for compatibility and may be used by specific pruners.
  # pruning_threshold: 0.9

  # FIM-related settings (only used by FIM-based schemes)
  # fim_threshold: 0.8
  fim_subset_size: 500
  fim_subset_seed: 42
  fim_subset_shuffle: true
  fim_calculate_method: "nngeometry" # Options: "nngeometry", "backprop"
  # Iterative pruning settings (only used by iterative schemes)
  iterative_pruning_steps: 5
  # Sweep settings (pruning.py uses this to generate pruning ratios)
  sweep:
    start: 0.0
    end: 1.0
    step: 0.2

evaluation: 
  # Basic metrics 
  metrics: 
    - accuracy 
    - loss 
    - mcc 
    - precision 
  validation_split: 0.2 
  
# Cross-validation settings 
cross_validation: 
  num_folds: 5 
  
# Pruning sweep settings 
pruning_sweep: 
  full_range: 
    start: 0.0 
    end: 1.0 
    step: 0.05 
  high_range: 
    start: 0.80 
    end: 1.0 
    step: 0.02 

# Plotting settings 
plots: 
  save_plots: true 
  plot_formats: ["png", "pdf"] 
  dpi: 300 

# NOTES: 
# - To use Fashion-MNIST: change dataset.name to "fashion_mnist" 
# - To use MNIST: change dataset.name to "mnist" 
# - Pruning threshold typically ranges from 0.001 to 0.1 
# - 0.001: very conservative (prunes very few weights) 
# - 0.01: moderate (good starting point) 
# - 0.1: aggressive (prunes many weights)